# fly.toml app configuration file generated for saas-photo-listing-platform on 2026-05-19T14:29:28+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'saas-photo-listing-platform-production'
primary_region = 'jnb'

[build]
  [build.args]
    GO_VERSION = '1.25.0'

[env]
  ENVIRONMENT = "production"
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024