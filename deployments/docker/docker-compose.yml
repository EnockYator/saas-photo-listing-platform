# Base configuration shared across all environments
services:
  app:
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        - APP_ENV=${APP_ENV}
    image: ${REGISTRY:-ghcr.io}/${NAMESPACE:-username}/${PROJECT_NAME}:${TAG:-latest}
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_URL=${DB_URL}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT}
          cpus: '${CPU_LIMIT}'
        reservations:
          memory: ${MEMORY_RESERVE}
          cpus: '${CPU_RESERVE}'

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped


volumes:
  postgres_data:
    name: ${PROJECT_NAME}_postgres_data

networks:
  app-network:
    name: ${PROJECT_NAME}_network
    driver: bridge
