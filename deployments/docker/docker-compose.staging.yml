version: '3.8'

# Staging configuration - mirrors production but with staging-specific overrides
services:
  app:
    build:
      target: staging
      args:
        - APP_ENV=staging
    image: ${REGISTRY:-ghcr.io}/${NAMESPACE:-username}/${PROJECT_NAME:-app}:staging-${GIT_COMMIT:-latest}
    environment:
      - APP_ENV=staging
      - LOG_LEVEL=info
      - SENTRY_ENVIRONMENT=staging
    ports:
      - "3000:3000"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      mode: replicated
      replicas: 1  # Single replica for staging
      resources:
        limits:
          memory: 1G
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.5'
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  postgres:
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  redis:
    volumes:
      - redis_staging_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

volumes:
  postgres_staging_data:
    name: ${PROJECT_NAME:-app}_postgres_staging
  redis_staging_data:
    name: ${PROJECT_NAME:-app}_redis_staging
