# This workflow runs database migrations after a successful Docker Build & Push.
# It ensures that migrations run against the exact image that was built and tested.
# It runs test migrations against a temporary Postgres instance before applying to staging/production.

name: Migrations

on:
  workflow_call:

permissions:
  contents: read
  packages: read
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  migrate:
    name: Run Database Migrations
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Download image metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load image metadata
        id: export
        run: |
          if [ ! -f digest.txt ] || [ ! -f image.txt ]; then
            echo "❌ Missing required artifact files"
            ls -la
            exit 1
          fi

          DIGEST="$(cat digest.txt | tr -d '\n')"
          IMAGE="$(cat image.txt | tr -d '\n')"

          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

          echo "✅ Using image: $IMAGE"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: docker pull "${IMAGE}"

      - name: Run test migrations (UP)
        id: test-migrations
        run: |
          echo "Running test migrations on temporary Postgres..."
          docker run --rm \
            --network ${{ job.services.postgres.network }} \
            -e DB_URL='postgres://postgres:postgres@postgres:5432/testdb?sslmode=disable' \
            "${IMAGE}" migrate up

      - name: Verify migration success
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d testdb -c "\dt"

      - name: Run staging/production migrations (UP)
        if: steps.test-migrations.outcome == 'success'
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          echo "Applying migrations to production database..."
          docker run --rm \
            -e DB_URL \
            "${IMAGE}" migrate up

      - name: Cleanup
        if: always()
        run: |
          # No manual containers to clean up — the service container is managed by GitHub
          echo "Cleanup complete"
