# This workflow runs database migrations after a successful Docker Build & Push.
# It ensures that migrations run against the exact image that was built and tested.
# It runs test migrations against a temporary Postgres instance before applying to staging/production.

name: Migrations

on:
  workflow_call:
    inputs:
      sha:
        description: 'The commit SHA that triggered the build / from orchestrator workflow'
        required: true
        type: string
      image:
        description: 'The Docker image to use for migrations'
        required: true
        type: string
      environment:
        description: 'The target environment for migrations (staging, production)'
        required: true
        type: string
    secrets:
      DB_URL:
        required: true

permissions:
  contents: read
  packages: read
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}

      - name: Load image metadata
        id: export
        run: |

          IMAGE=${{ inputs.image }}

          if [ -z "$IMAGE" ]; then
            echo "❌ Missing image input"
            exit 1
          fi

          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

          echo "✅ Using image: $IMAGE"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: docker pull "${IMAGE}"

      - name: Run test migrations (UP)
        id: test-migrations
        run: |
          echo "Running test migrations on temporary Postgres..."
          docker run --rm \
            --network ${{ job.services.postgres.network }} \
            -e DB_URL='postgres://postgres:postgres@postgres:5432/testdb?sslmode=disable' \
            "${IMAGE}" migrate up

      - name: Verify migration success
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d testdb -c "\dt"

      - name: Run staging/production migrations (UP)
        if: steps.test-migrations.outcome == 'success'
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
        run: |
          echo "Applying migrations to production database..."
          echo "Target environment: ${{ inputs.environment }}"
          echo "DB_USER: ${{ secrets.DB_USER }}"
          echo "DB_URL: ${{ secrets.DB_URL }}"

          if [ -z "$DB_URL" ]; then
            echo "DB_URL is empty"
            exit 1
          else
            echo "DB_URL first 10 chars: ${DB_URL:0:10}..."
          fi

          docker run --rm \
            -e DB_URL="${DB_URL}" \
            "${IMAGE}" migrate up

      - name: Cleanup
        if: always()
        run: |
          # No manual containers to clean up — the service container is managed by GitHub
          echo "Cleanup complete"
