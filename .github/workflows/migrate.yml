# This workflow runs database migrations after a successful Docker Build & Push.
# It ensures that migrations run against the exact image that was built and tested.
# It runs test migrations against a temporary Postgres instance before applying to staging/production.

name: Migrations

on:
  # pull_request:
  #     branches: [main, dev]
  # push:
  #   branches: [main, dev]
  repository_dispatch:
    types: [run-migrations]

permissions:
  contents: read
  packages: read
  actions: read  # Needed when downloading artifacts from another workflow run

env:
  REGISTRY: ghcr.io

jobs:
  migrate:
    name: Run Database Migrations
    environment: ${{ github.event.client_payload.branch == 'refs/heads/main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      digest: ${{ steps.export.outputs.digest }}
      image: ${{ steps.export.outputs.image }}
      docker_build_run_id: ${{ steps.export.outputs.docker_build_run_id }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # For push events, use the pushed branch; for dispatch, use the SHA from payload.
          ref: ${{ github.event_name == 'push' && github.ref || github.event.client_payload.sha }}

      - name: Download image metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: .
          run-id: ${{ github.event.client_payload.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load image metadata
        id: export
        run: |
          if [ ! -f digest.txt ] || [ ! -f image.txt ] || [ ! -f docker_build_run_id.txt ]; then
            echo "❌ Missing required artifact files"
            ls -la
            exit 1
          fi

          DIGEST="$(cat digest.txt | tr -d '\n')"
          IMAGE="$(cat image.txt | tr -d '\n')"
          DOCKER_BUILD_RUN_ID="$(cat docker_build_run_id.txt | tr -d '\n')"

          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "DOCKER_BUILD_RUN_ID=$DOCKER_BUILD_RUN_ID" >> $GITHUB_ENV

          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "docker_build_run_id=${DOCKER_BUILD_RUN_ID}" >> $GITHUB_OUTPUT

          echo "✅ Using image: $IMAGE"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: docker pull "${IMAGE}"

      - name: Run test migrations (UP)
        id: test-migrations
        run: |
          echo "Running test migrations on temporary Postgres..."
          docker run --rm \
            --network ${{ job.services.postgres.network }} \
            -e DB_URL='postgres://postgres:postgres@postgres:5432/testdb?sslmode=disable' \
            "${IMAGE}" migrate up

      - name: Verify migration success
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d testdb -c "\dt"

      - name: Run staging/production migrations (UP)
        if: steps.test-migrations.outcome == 'success'
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          echo "Applying migrations to production database..."
          if [ -z "$DB_URL" ]; then
            echo "DB_URL is empty"
          else
            echo "DB_URL is set (length: ${#DB_URL})"
          fi
          docker run --rm \
            -e DB_URL \
            "${IMAGE}" migrate up

      - name: Cleanup
        if: always()
        run: |
          # No manual containers to clean up — the service container is managed by GitHub
          echo "Cleanup complete"

  trigger-deployment:
    name: Repository Dispatch
    needs: [migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to trigger repository dispatch

    steps:
      - name: Trigger deployment workflows
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          event-type: run-deployment
          client-payload: |
            {
              "sha": "${{ github.event.client_payload.sha }}",
              "run_id": "${{ needs.migrate.outputs.docker_build_run_id }}",
              "branch": "${{ github.event.client_payload.branch }}"
            }
