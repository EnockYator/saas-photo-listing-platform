# This workflow runs database migrations after a successful Docker Build & Push.
# It ensures that migrations run against the exact image that was built and tested.
# It runs test migrations against a temporary Postgres instance before applying to staging/production.

name: Migrations

on:
  workflow_call:
    inputs:
      sha:
        description: 'The commit SHA that triggered the build / from orchestrator workflow'
        required: true
        type: string
      environment:
        description: 'The target environment for migrations (staging, production)'
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    outputs:
      image: ${{ steps.export.outputs.image }}
      digest: ${{ steps.export.outputs.digest }}
      version: ${{ steps.export.outputs.version }}
      repo_lower: ${{ steps.export.outputs.repo_lower }}

    steps:
      - name: Download metadata
        uses: actions/download-artifact@v7
        with:
          name: pipeline-metadata

      - name: Load metadata
        id: export
        run: |
          set -a
          source metadata.env
          set +a

          if [ -z "$IMAGE" ] || [ -z "$DIGEST" ] || [ -z "$VERSION" ] || [ -z "$REPO_LOWER" ]; then
            echo "❌ Missing required metadata values"
            exit 1
          fi

          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: docker pull "${{ steps.export.outputs.image }}"

      - name: Run test migrations (UP)
        id: test-migrations
        run: |
          echo "Running test migrations on temporary Postgres..."
          docker run --rm \
            --network ${{ job.services.postgres.network }} \
            -e DB_URL='postgres://postgres:postgres@postgres:5432/testdb?sslmode=disable' \
            "${{ steps.export.outputs.image }}" migrate up

      - name: Verify migration success
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d testdb -c "\dt"

      - name: Run staging/production migrations (UP)
        if: steps.test-migrations.outcome == 'success'
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          echo "Applying migrations to production database..."
          echo "Target environment: ${{ inputs.environment }}"

          if [ -z "$DB_URL" ]; then
            echo "DB_URL is empty"
            exit 1
          fi

          docker run --rm \
            -e DB_URL="${DB_URL}" \
            "${{ steps.export.outputs.image }}" migrate up

      - name: Cleanup
        if: always()
        run: |
          # No manual containers to clean up — the service container is managed by GitHub
          echo "Cleanup complete"
