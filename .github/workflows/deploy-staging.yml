# Purpose:
#   Deploy already-built Docker images to Render staging (dev branch)
#   Generate .env from GitHub Secrets and apply to Render
#   Deploy only after migrations succeed

name: Deploy to Staging

on:
  workflow_run:
    workflows: ["Migrations"]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read  # Needed when downloading artifacts from another workflow run

env:
  REGISTRY: ghcr.io

jobs:
  deploy-render-staging:
    name: Deploy to Render Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    outputs:
      digest: ${{ steps.export.outputs.digest }}
      image: ${{ steps.export.outputs.image }}
      docker_build_run_id: ${{ steps.export.outputs.docker_build_run_id }}

    steps:
      # Download image-metadata artifact from Docker Build workflow
      - name: Download image metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Load immutable image metadata
      - name: Load image metadata
        id: export
        run: |
          if [ ! -f digest.txt ] || [ ! -f image.txt ] || [ ! -f docker_build_run_id.txt ]; then
            echo "❌ Missing required artifact files"
            ls -la
            exit 1
          fi

          DIGEST="$(cat digest.txt | tr -d '\n')"
          if [ -z "$DIGEST" ]; then
            echo "❌ Missing image digest artifact"
            exit 1
          fi

          IMAGE="$(cat image.txt | tr -d '\n')"
          if [ -z "$IMAGE" ]; then
            echo "❌ Missing image name artifact"
            exit 1
          fi

          DOCKER_BUILD_RUN_ID="$(cat docker_build_run_id.txt | tr -d '\n')"
          if [ -z "$DOCKER_BUILD_RUN_ID" ]; then
            echo "❌ Missing docker build run ID artifact"
            exit 1
          fi

          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "DOCKER_BUILD_RUN_ID=$DOCKER_BUILD_RUN_ID" >> $GITHUB_ENV

          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "docker_build_run_id=${DOCKER_BUILD_RUN_ID}" >> $GITHUB_OUTPUT

          echo "Using image: $IMAGE"
          echo "Using digest: $DIGEST"
          echo "Using docker_build_run_id: $DOCKER_BUILD_RUN_ID"

      # ----------------------------
      # Render ENV variables
      # ----------------------------
      - name: Update Render Environment Variables
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -e

          # Create a temporary file to avoid exposing secrets in command line
          env_vars_file=$(mktemp)
          
          cat > "$env_vars_file" << 'EOF'
          [
            {"key": "DB_HOST", "value": "${{ secrets.DB_HOST }}"},
            {"key": "DB_URL", "value": "${{ secrets.DB_URL }}"},
            {"key": "DB_USER", "value": "${{ secrets.DB_USER }}"},
            {"key": "DB_PASSWORD", "value": "${{ secrets.DB_PASSWORD }}"},
            {"key": "DB_NAME", "value": "${{ secrets.DB_NAME }}"},
            {"key": "DB_SSLMODE", "value": "${{ secrets.DB_SSLMODE }}"},
            {"key": "CHANNEL_BINDING", "value": "${{ secrets.CHANNEL_BINDING }}"},
            {"key": "DB_DRIVER", "value": "${{ secrets.DB_DRIVER }}"},
            {"key": "APP_ENV", "value": "${{ secrets.APP_ENV }}"},
            {"key": "PROJECT_NAME", "value": "${{ secrets.PROJECT_NAME }}"},
            {"key": "SERVER_PORT", "value": "${{ secrets.SERVER_PORT }}"},
            {"key": "SERVER_READ_TIMEOUT", "value": "${{ secrets.SERVER_READ_TIMEOUT }}"},
            {"key": "SERVER_WRITE_TIMEOUT", "value": "${{ secrets.SERVER_WRITE_TIMEOUT }}"},
            {"key": "SERVER_IDLE_TIMEOUT", "value": "${{ secrets.SERVER_IDLE_TIMEOUT }}"},
            {"key": "JWT_SECRET", "value": "${{ secrets.JWT_SECRET }}"},
            {"key": "JWT_EXPIRATION", "value": "${{ secrets.JWT_EXPIRATION }}"},
            {"key": "LOG_LEVEL", "value": "${{ secrets.LOG_LEVEL }}"},
            {"key": "DEBUG", "value": "${{ secrets.DEBUG }}"},
            {"key": "APP_PORT", "value": "${{ secrets.APP_PORT }}"},
            {"key": "MEMORY_LIMIT", "value": "${{ secrets.MEMORY_LIMIT }}"},
            {"key": "CPU_LIMIT", "value": "${{ secrets.CPU_LIMIT }}"},
            {"key": "MEMORY_RESERVE", "value": "${{ secrets.MEMORY_RESERVE }}"},
            {"key": "CPU_RESERVE", "value": "${{ secrets.CPU_RESERVE }}"},
            {"key": "REPLICAS", "value": "${{ secrets.REPLICAS }}"}
          ]
          EOF

          # Use jq to process each variable
          jq -c '.[]' "$env_vars_file" | while read -r env_var; do
            key=$(echo "$env_var" | jq -r '.key')
            value=$(echo "$env_var" | jq -r '.value')
            
            response=$(curl -s -w "%{http_code}" -X PUT \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}" \
              -H "accept: application/json" \
              -H "authorization: Bearer ${RENDER_API_KEY}" \
              -H "content-type: application/json" \
              -d "{\"value\": \"${value}\"}")
            
            http_code=${response: -3}
            if [ "$http_code" != "200" ]; then
              echo "❌ Failed to update env var $key (HTTP $http_code)"
              exit 1
            fi
          done

          # Add RENDER_SERVICE_ID
          curl -s -X PUT \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/RENDER_SERVICE_ID" \
            -H "authorization: Bearer ${RENDER_API_KEY}" \
            -H "content-type: application/json" \
            -d "{\"value\": \"${RENDER_SERVICE_ID}\"}"
          
          rm -f "$env_vars_file"

      # ----------------------------
      # Deploy image using name (attached to immutable digest)
      # ----------------------------
      - name: Trigger Staging Deploy on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Deploying image: ${IMAGE}"

          RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "authorization: Bearer ${RENDER_API_KEY}" \
            -H "content-type: application/json" \
            -d "{\"imageUrl\": \"${IMAGE}\"}")

          echo "$RESPONSE"

          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ "$DEPLOY_ID" = "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "❌ Deploy failed"
            exit 1
          fi

          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_ENV
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT

      # ----------------------------
      # Wait for deployment to complete
      # ----------------------------
      - name: Wait for deployment to complete
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -e

          for i in {1..30}; do
            STATUS=$(curl -s \
              -H "authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              | jq -r '.[0].status')

            echo "Status: $STATUS"

            case "$STATUS" in
              live) exit 0 ;;
              failed) exit 1 ;;
              deploying|build_in_progress) sleep 10 ;;
              *) echo "unknown status"; sleep 10 ;;
            esac
          done

          echo "❌ Deployment timeout"
          exit 1

      # ----------------------------
      # Verify deployment
      # ----------------------------
      - name: Verify staging deployment
        run: |
          sleep 10

          DOMAIN="${{ secrets.RENDER_DOMAIN }}"

          if [ -z "$DOMAIN" ]; then
            echo "⚠️ No domain set"
            exit 0
          fi

          if ! curl -f "https://${DOMAIN}/health"; then
            echo "⚠️ health endpoint missing"
          fi
          
          if ! curl -f "https://${DOMAIN}/version"; then
            echo "⚠️ version endpoint missing"
          fi