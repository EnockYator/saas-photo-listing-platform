# Staging Deployment Workflow
# Purpose:
#   Deploy dev branch to staging
#   Deploy only after migrations succeed
#   Zero-downtime Docker deployment approach
#   Used for QA testing

name: Deploy to Staging

on:
  workflow_run:
    workflows: ["Staging Database Migration"]
    branches: [dev]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-flyio:
    name: Deploy to Fly.io Staging
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only \
            --config fly.staging.toml \
            --image ghcr.io/${{ github.repository }}-api:${{ github.sha }}

      - name: Verify Fly.io deployment
        run: |
          curl -f https://api.fly.io/v1/apps/saas-photo-listing-platform-staging/health || exit 1

  deploy-render:
    name: Deploy to Render Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
        run: |
          curl -X POST \
            https://api.render.com/v1/services/${{ secrets.RENDER_STAGING_SERVICE_ID }}/deploys \
            -H "accept: application/json" \
            -H "authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "content-type: application/json" \
            -d '{
              "image": {
                "imageUrl": "ghcr.io/${{ github.repository }}-api:${{ github.sha }}"
              }
            }'
