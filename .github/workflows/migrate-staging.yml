# Purpose:
#   Run database migrations safely
#   Fail deployment if migrations fail
#   Execute migrate CLI with arguments

name: Staging Database Migration

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  migrate:
    name: Run staging Database Migrations
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Build migrate CLI
        run: go build -o migrate ./cmd/migrate

      - name: Make migrate executable
        run: chmod +x migrate

      - name: Run migrations
        run: ./migrate up
        env:
          APP_ENV: staging
          DB_URL: ${{ secrets.DB_URL }}

      - name: Verify migration version
        run: ./migrate version