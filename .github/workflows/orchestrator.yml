name: Orchestrator CI/CD

on:
  push :
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint Codebase
    uses: ./.github/workflows/lint.yml
    with:
      sha: ${{ github.sha }}

  security:
    name: Run Security Checks
    needs: lint
    uses: ./.github/workflows/security.yml
    with:
      sha: ${{ github.sha }}

  ci:
    name: Run CI Workflow
    needs: security
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ github.sha }}

  build:
    name: Run Docker Build Workflow
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/docker-build.yml
    with:
      sha: ${{ github.sha }}

  migrate:
    name: Run Migrations Workflow
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/migrate.yml
    secrets:
      DB_URL: ${{ secrets.DB_URL }}
    with:
      sha: ${{ github.sha }}
      digest: ${{ needs.build.outputs.digest }}
      image: ${{ needs.build.outputs.image }}
      version: ${{ needs.build.outputs.version }}
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}


  deploy-render-staging:
    name: Run Deploy Staging Workflow
    needs: migrate
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy-staging.yml
    secrets:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_DOMAIN: ${{ secrets.RENDER_DOMAIN }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
      CHANNEL_BINDING: ${{ secrets.CHANNEL_BINDING }}
      DB_DRIVER: ${{ secrets.DB_DRIVER }}
      APP_ENV: ${{ secrets.APP_ENV }}
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_READ_TIMEOUT: ${{ secrets.SERVER_READ_TIMEOUT }}
      SERVER_WRITE_TIMEOUT: ${{ secrets.SERVER_WRITE_TIMEOUT }}
      SERVER_IDLE_TIMEOUT: ${{ secrets.SERVER_IDLE_TIMEOUT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
      DEBUG: ${{ secrets.DEBUG }}
      APP_PORT: ${{ secrets.APP_PORT }}
      MEMORY_LIMIT: ${{ secrets.MEMORY_LIMIT }}
      CPU_LIMIT: ${{ secrets.CPU_LIMIT }}
      MEMORY_RESERVE: ${{ secrets.MEMORY_RESERVE }}
      CPU_RESERVE: ${{ secrets.CPU_RESERVE }}
      REPLICAS: ${{ secrets.REPLICAS }}
    with:
      sha: ${{ github.sha }}
      image: ${{ needs.migrate.outputs.image }}
      digest: ${{ needs.migrate.outputs.digest }}
      version: ${{ needs.migrate.outputs.version }}
      environment: staging

  deploy-render-production:
    name: Run Deploy Production Workflow
    needs: migrate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-production.yml
    with:
      sha: ${{ github.sha }}
      image: ${{ needs.migrate.outputs.image }}
      digest: ${{ needs.migrate.outputs.digest }}
      version: ${{ needs.migrate.outputs.version }}
      environment: production

  release:
    name: Run Release Workflow
    needs: deploy-render-production
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ github.sha }}
      digest: ${{ needs.deploy-render-production.outputs.digest }}
      image: ${{ needs.deploy-render-production.outputs.image }}
      version: ${{ needs.deploy-render-production.outputs.version }}
      environment: production
