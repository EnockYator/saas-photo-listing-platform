
# Purpose:
#   Static analysis
#   Code formatting
#   Maintain consistent code quality

name: Lint

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

env:
  GO_VERSION: '1.25'

jobs:
  golangci:
    name: GolangCI-Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.0.2

      - name: Run golangci-lint
        run: golangci-lint run --timeout 5m

  gofmt:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check gofmt
        run: |
          UNFORMATTED=$(find . -name '*.go' -type f | xargs gofmt -s -l)

          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Files not formatted:"
            echo "$UNFORMATTED"
            echo ""
            echo "Run locally:"
            echo "gofmt -s -w ."
            exit 1
          fi

          echo "✅ All files properly formatted"