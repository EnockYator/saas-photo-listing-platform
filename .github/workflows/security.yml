# Purpose:
#   Detect vulnerable dependencies
#   Detect insecure code
#   SaaS production security checks

name: Security Scan

on:
  workflow_call:
    inputs:
      sha:
        description: 'The commit SHA that triggered the build / from orchestrator workflow'
        required: true
        type: string
  schedule:
    - cron: '0 0 * * 0' # Weekly

permissions:
  contents: read
  security-events: write
  actions: read  # For some scanners

env:
  GO_VERSION: '1.22.5'

jobs:
  govulncheck:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck -tags=production ./... >> vuln-report.txt || true

          cat vuln-report.txt

          if grep -q "Your code is affected by" vuln-report.txt; then
            echo "⚠️ Vulnerabilities detected"
          else
            echo "✅ No known vulnerabilities"
          fi

  gosec:
    name: Security Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.19.0
        with:
          args: -fmt=sarif -out=results.sarif ./...
        continue-on-error: true

      - name: Ensure SARIF file exists
        if: always()
        run: |
          if [ ! -f results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Gosec"}},"results":[]}]}' > results.sarif
          fi

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3.27.0
        with:
          sarif_file: results.sarif
          category: gosec
        continue-on-error: true

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0  # Fetch all history for proper commit scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_NOTIFY_USER_LIST: '@${{ github.event.pull_request.user.login }}, @${{ github.actor }}'
