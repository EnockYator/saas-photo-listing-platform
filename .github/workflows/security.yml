# Purpose:
#   Detect vulnerable dependencies
#   Detect insecure code
#   SaaS production security checks

name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read
  security-events: write
  actions: read  # For some scanners

env:
  GO_VERSION: '1.24'

jobs:
  govulncheck:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck ./... | tee vuln-report.txt

          cat vuln-report.txt

          if grep -q "Vulnerability" vuln-report.txt; then
            exit 1
          fi

  gosec:
    name: Security Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.22.4
        with:
          args: -fmt sarif -out /github/workspace/results.sarif  ./cmd/... ./internal/...

      - name: Upload Gosec SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          args: -fmt sarif -out /github/workspace/results.sarif ./cmd/... ./internal/...
          sarif_file: results.sarif

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
