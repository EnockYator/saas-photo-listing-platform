# Purpose:
#   Detect vulnerable dependencies
#   Detect insecure code
#   SaaS production security checks

name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read
  security-events: write
  actions: read  # For some scanners

env:
  GO_VERSION: '1.22.5'

jobs:
  govulncheck:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck ./... > vuln-report.txt || true

          cat vuln-report.txt

          if grep -q "Your code is affected by" vuln-report.txt; then
            echo "⚠️ Vulnerabilities detected"
          else
            echo "✅ No known vulnerabilities"
          fi

gosec:
  name: Security Static Analysis
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Install specific Gosec version
      run: |
        GOBIN=/usr/local/bin go install github.com/securego/gosec/v2/cmd/gosec@v2.19.0

    - name: Run Gosec (SARIF output)
      continue-on-error: true
        gosec -fmt=sarif -out=results.sarif ./cmd/... ./internal/...

    - name: Ensure SARIF file exists (even if Gosec failed)
      if: always()
      run: |
        if [ ! -f results.sarif ]; then
          echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Gosec"}},"results":[]}]}' > results.sarif
        fi

    - name: Upload SARIF to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
        category: gosec
      continue-on-error: false

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper commit scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          no-redact: false
          report-format: sarif
          report-name: gitleaks-results
