# Purpose:
#   Detect vulnerable dependencies
#   Detect insecure code
#   SaaS production security checks

name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read
  security-events: write
  actions: read  # For some scanners

env:
  GO_VERSION: '1.24'

jobs:
  govulncheck:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck ./... > vuln-report.txt || true

          cat vuln-report.txt

          if grep -q "Your code is affected by" vuln-report.txt; then
            echo "⚠️ Vulnerabilities detected"
          else
            echo "✅ No known vulnerabilities"
          fi

  gosec:
    name: Security Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: -fmt=sarif -out=results.sarif ./cmd/... ./internal/...

      - name: Verify SARIF file exists
        run: ls -lah results.sarif

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
