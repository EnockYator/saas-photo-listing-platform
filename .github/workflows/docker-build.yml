# Docker Build and Push Workflow
# Purpose:
#   Build a single Docker image containing both API and migration
#   Test the image to ensure it works correctly
#   Push to GitHub Container Registry
#   Tag with commit SHA and expose digest for deployments

name: Docker Build & Push

on:
  workflow_call:
    inputs:
      sha:
        description: 'The commit SHA that triggered the build / from orchestrator workflow'
        required: true
        type: string

    outputs:
      image:
        description: "Built Docker image reference"
        value: ${{ jobs.build.outputs.image }}

      digest:
        description: "Image digest"
        value: ${{ jobs.build.outputs.digest }}

      version:
        description: "Image version tag"
        value: ${{ jobs.build.outputs.version }}

      repo_lower:
        description: "Lowercase repository name for GHCR"
        value: ${{ jobs.build.outputs.repo_lower }}

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.23.0"
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      digest: ${{ steps.export.outputs.digest }}
      image: ${{ steps.export.outputs.image }}
      version: ${{ steps.next_version.outputs.version }}
      repo_lower: ${{ steps.lowercase.outputs.repo_lower }}

    steps:
      - name: Checkout full history (to compute version)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0   # full history needed to find tags
          fetch-tags: true # ensure tags are fetched for versioning

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lowercase repository name
        id: lowercase
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          echo "repo_lower=$REPO_LOWER" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next version
        id: next_version
        shell: bash
        run: |
          set -euo pipefail

          MAJOR=0
          MINOR=0
          PATCH=0

          # ----------------------------
          # Get latest semver tag safely
          # ----------------------------
          LAST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname 2>/dev/null | head -n1 || true)

          if [ -z "${LAST_TAG:-}" ]; then
            LAST_TAG="v0.0.0"
          fi

          echo "Last tag: $LAST_TAG"

          # ----------------------------
          # Determine commit range safely
          # ----------------------------
          if git rev-parse "$LAST_TAG" >/dev/null 2>&1 && [ "$LAST_TAG" != "v0.0.0" ]; then
            COMMIT_RANGE="$LAST_TAG..HEAD"
          else
            COMMIT_RANGE="HEAD"
          fi

          echo "Commit range: $COMMIT_RANGE"

          # ----------------------------
          # Safely fetch commit messages
          # ----------------------------
          LOG_OUTPUT=$(git log --pretty=format:%s "$COMMIT_RANGE" 2>/dev/null || true)

          # ----------------------------
          # If there are NO commits, keep version
          # ----------------------------
          if [ "$LAST_TAG" != "v0.0.0" ] && [ -z "$LOG_OUTPUT" ]; then
            echo "No new commits since $LAST_TAG – keeping same version"
            echo "version=$LAST_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ----------------------------
          # Analyze commit messages
          # ----------------------------
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue

            case "$msg" in
              *"BREAKING CHANGE:"*|*"BREAKING-CHANGE:"*|*"!*:")
                MAJOR=1
                ;;
              feat:*|feat\(*\):*)
                MINOR=1
                ;;
              fix:*|fix\(*\):*)
                PATCH=1
                ;;
            esac
          done <<< "$LOG_OUTPUT"

          # ----------------------------
          # Decide bump type
          # ----------------------------
          if [ "$MAJOR" -eq 1 ]; then
            BUMP="major"
          elif [ "$MINOR" -eq 1 ]; then
            BUMP="minor"
          elif [ "$PATCH" -eq 1 ]; then
            BUMP="patch"
          else
            BUMP="patch"
            echo "⚠️ No conventional commits found, defaulting to patch bump"
          fi

          # ----------------------------
          # Compute new version
          # ----------------------------
          V="${LAST_TAG#v}"
          IFS='.' read -r v_major v_minor v_patch <<< "$V"

          v_major=${v_major:-0}
          v_minor=${v_minor:-0}
          v_patch=${v_patch:-0}

          case "$BUMP" in
            major)
              v_major=$((v_major + 1))
              v_minor=0
              v_patch=0
              ;;
            minor)
              v_minor=$((v_minor + 1))
              v_patch=0
              ;;
            patch)
              v_patch=$((v_patch + 1))
              ;;
          esac

          NEW_VERSION="v${v_major}.${v_minor}.${v_patch}"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          echo "New version: $NEW_VERSION"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.repo_lower }}:${{ inputs.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}:{2}', env.REGISTRY, ${{ steps.lowercase.outputs.repo_lower }}, ${{ steps.next_version.outputs.version }}) || '' }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.next_version.outputs.version }}
            BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            GO_VERSION=${{ env.GO_VERSION }}

      - name: Resolve image digest
        id: export
        run: |
          IMAGE_WITH_TAG="${{ env.REGISTRY }}/${{ steps.lowercase.outputs.repo_lower }}:${{ inputs.sha }}"

          DIGEST=$(docker buildx imagetools inspect \
            "${IMAGE_WITH_TAG}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')

          if [ -z "$DIGEST" ]; then
            echo "❌ Failed to retrieve image digest"
            exit 1
          fi

          IMAGE="${{ env.REGISTRY }}/${{ steps.lowercase.outputs.repo_lower }}@${DIGEST}"

          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

  test-image:
    name: Test Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres  # Default postgres user
          POSTGRES_PASSWORD: postgres # Test credentials
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ needs.build.outputs.image }}

      - name: Validate image structure
        run: |
          docker inspect ${{ needs.build.outputs.image }} > /dev/null && {
            echo "✅ Image is valid and accessible"
          } || {
            echo "❌ Image inspection failed"
            exit 1
          }

      - name: Test container startup
        run: |
          echo "Starting container..."
          CONTAINER_ID=$(docker run -d \
            --network ${{ job.services.postgres.network }} \
            -e DB_URL='postgres://postgres:postgres@postgres:5432/testdb?sslmode=disable' \
            -p 8080:8080 \
            ${{ needs.build.outputs.image }} api)

          echo "Waiting for API to be ready..."
          for i in {1..15}; do
            if curl -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Container started and API is responsive"
              docker logs $CONTAINER_ID
              docker stop $CONTAINER_ID
              exit 0
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done

          echo "❌ API not healthy"
          echo "Container logs:"
          docker logs $CONTAINER_ID
          docker stop $CONTAINER_ID
          exit 1

  sign-image:
    name: Sign Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      packages: write
      id-token: write   # REQUIRED for cosign OIDC

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.0"

      - name: Sign image using cosign
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            --oidc-issuer=https://token.actions.githubusercontent.com \
            ${{ needs.build.outputs.image }}

  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    needs: [build]
    if: always()

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ needs.build.outputs.repo_lower }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
        continue-on-error: true
