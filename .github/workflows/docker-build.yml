# Docker Build and Push Workflow
# Purpose:
#   Build a single Docker image containing both API and migration
#   Test the image to ensure it works correctly
#   Push to GitHub Container Registry
#   Tag with commit SHA and expose digest for deployments

name: Docker Build & Push

on:
  workflow_call: # Called by CI
    outputs:
      digest:
        description: "Image digest"
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: "Full image reference (with digest)"
        value: ${{ jobs.build.outputs.image }}
      docker_build_run_id:
        description: "Run ID of the docker build workflow"
        value: ${{ jobs.build.outputs.docker_build_run_id }}

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.23.0"
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      digest: ${{ steps.export.outputs.digest }}
      image: ${{ steps.export.outputs.image }}
      docker_build_run_id: ${{ steps.export.outputs.docker_build_run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: lowercase
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT
          echo "REPO_LOWER=${REPO_LOWER}" >>$GITHUB_ENV

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.repo_lower }}:${{ github.sha }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            GO_VERSION=${{ env.GO_VERSION }}

      - name: Resolve image digest
        id: export
        run: |
          IMAGE_WITH_TAG="${{ env.REGISTRY }}/${{ steps.lowercase.outputs.repo_lower }}:${{ github.sha }}"

          DIGEST=$(docker buildx imagetools inspect \
            "${IMAGE_WITH_TAG}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')

          if [ -z "$DIGEST" ]; then
            echo "❌ Failed to retrieve image digest"
            exit 1
          fi

          IMAGE="${{ env.REGISTRY }}/${{ steps.lowercase.outputs.repo_lower }}@${DIGEST}"

          DOCKER_BUILD_RUN_ID=${{ github.run_id }}

          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "docker_build_run_id=${DOCKER_BUILD_RUN_ID}" >> $GITHUB_OUTPUT

          # persist data for downstream job
          echo "${DIGEST}" > digest.txt
          echo "${IMAGE}" > image.txt
          echo "${DOCKER_BUILD_RUN_ID}" > docker_build_run_id.txt

      - name: Upload image metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-metadata
          path: |
            digest.txt
            image.txt
            docker_build_run_id.txt

  test-image:
    name: Test Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ needs.build.outputs.image }}

      - name: Basic container validation (version)
        run: |
          docker run --rm ${{ needs.build.outputs.image }} version || {
            echo "❌ Container ${{ needs.build.outputs.image }} failed to run"
            exit 1
          }

  sign-images:
    name: Sign Docker Image
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      packages: write
      id-token: write   # REQUIRED for cosign OIDC

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.0"

      - name: Sign image using cosign
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            --oidc-issuer=https://token.actions.githubusercontent.com \
            ${{ needs.build.outputs.image }}

  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && !cancelled()

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ needs.build.outputs.repo_lower }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
        continue-on-error: true
