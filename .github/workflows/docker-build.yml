# Docker Build and Push Workflow
# Purpose:
#   Build a single Docker image containing both API and migration
#   Test the image to ensure it works correctly
#   Push to GitHub Container Registry
#   Tag with commit SHA and expose digest for deployments

name: Docker Build & Push

on:
  workflow_run:
    workflows: ["CI", "Lint", "Security Scan"]
    branches: [main, dev]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.23.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}/app

jobs:
  build:
    name: Build & Push Image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      digest: ${{ steps.export.outputs.digest }}
      image: ${{ steps.export.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Generate sqlc code
        run: sqlc generate

      - name: Ensure clean generated state
        run: git diff --exit-code

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
            GO_VERSION=${{ env.GO_VERSION }}

      - name: Store Docker Build run_id
        run: |
          echo "DOCKER_BUILD_RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - name: Save docker run_id to repo (using gh CLI)
        run: |
          echo "${{ github.run_id }}" > /tmp/docker_build_run_id.txt
          gh variable set DOCKER_BUILD_RUN_ID --body "${{ github.run_id }}"

      - name: Resolve image digest
        id: export
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --format '{{json .Manifest.Digest}}' | tr -d '"')

          if [ -z "$DIGEST" ]; then
            echo "❌ Failed to retrieve image digest"
            exit 1

          IMAGE=${{ env.IMAGE_NAME }}@${DIGEST}
          
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

          # persist digest for downstream jobs
          echo "${DIGEST}" > digest.txt
          echo "${IMAGE}" > image.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-metadata-${{ github.run_id }}
          path: |
            digest.txt
            image.txt

  test-image:
    name: Test Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15

    steps:
      # Download image-metadata artifact from Docker Build workflow
      - name: Download image metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: .
          run-id: ${{ DOCKER_BUILD_RUN_ID }}  # Docker Build's run_id
  
      # Load immutable image metadata (digest, image)
      - name: Load image metadata
        run: |
          DIGEST="$(cat digest.txt | tr -d '\n')"
          if [ -z "$DIGEST" ]; then
            echo "❌ Missing image digest artifact"
            exit 1
          fi

          IMAGE="$(cat image.txt | tr -d '\n')"
          if [ -z "$IMAGE" ]; then
            echo "❌ Missing image name artifact"
            exit 1
          fi

          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

          echo "Using image: $IMAGE"
          echo "Using digest: $DIGEST"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image (using name attached to digest)
        run: docker pull ${IMAGE}

      - name: Basic container validation
        run: |
          docker run --rm ${IMAGE} version || true
          docker run --rm ${IMAGE} --help || true

  sign-images:
    name: Sign Docker Image (by digest)
    runs-on: ubuntu-latest
    needs: [build, test-image]

    permissions:
      packages: write
      id-token: write   # REQUIRED for cosign OIDC

    steps:
      # Download image-metadata artifact from Docker Build workflow
      - name: Download image metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: .
          run-id: ${{ DOCKER_BUILD_RUN_ID }}  # Docker Build's run_id

      # Load immutable image metadata (digest, image)
      - name: Load image metadata
        run: |
          DIGEST="$(cat digest.txt | tr -d '\n')"
          if [ -z "$DIGEST" ]; then
            echo "❌ Missing image digest artifact"
            exit 1
          fi

          IMAGE="$(cat image.txt | tr -d '\n')"
          if [ -z "$IMAGE" ]; then
            echo "❌ Missing image name artifact"
            exit 1
          fi

          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

          echo "Using image: $IMAGE"
          echo "Using digest: $DIGEST"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.0"

      - name: Sign image using cosign (with OIDC)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            --oidc-issuer=https://token.actions.githubusercontent.com \
            ${IMAGE}

  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    needs: [build, test-image]
    if: github.ref_name == 'main'

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.repository }}/app
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true