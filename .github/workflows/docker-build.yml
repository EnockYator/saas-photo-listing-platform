# Docker Build and Push Workflow
# Purpose:
#   Build a single Docker image containing both API and migration
#   Test the image to ensure it works correctly
#   Push to GitHub Container Registry
#   Tag with commit SHA and expose digest for deployments

name: Docker Build & Push

on:
  repository_dispatch:
    types: [docker-build]

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.23.0"
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      digest: ${{ steps.export.outputs.digest }}
      image: ${{ steps.export.outputs.image }}
      docker_build_run_id: ${{ steps.export.outputs.docker_build_run_id }}
      version: ${{ steps.next_version.outputs.new_version }}

    steps:
      - name: Checkout full history (to compute version)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 0   # full history needed to find tags

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lowercase repository name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=$REPO_LOWER" >> $GITHUB_ENV
          echo "repo_lower=$REPO_LOWER" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next version
        id: next_version
        shell: bash
        run: |
          # If the repository has no commits at all, output the initial version
          if ! git rev-parse HEAD >/dev/null 2>&1; then
            echo "No commits found – using initial version v0.0.1"
            echo "version=v0.0.1" >> "$GITHUB_OUTPUT"
            echo "NEW_VERSION=v0.0.1" >> "$GITHUB_ENV"
            exit 0
          fi

          # Find latest semver tag (e.g. v1.2.3)
          LAST_TAG=$(git tag --sort=-v:refname --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
          fi
          echo "Last tag: $LAST_TAG"

          # Set the commit range to analyse
          MAJOR=0; MINOR=0; PATCH=0
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="$LAST_TAG..HEAD"
          fi

          # Scan commit messages – guard against git log failure with || true
          while IFS= read -r msg; do
            case "$msg" in
              *"BREAKING CHANGE:"*|*"BREAKING-CHANGE:"*|*!:*)
                MAJOR=1 ;;
              feat:*|feat\(*\):*)
                MINOR=1 ;;
              fix:*|fix\(*\):*)
                PATCH=1 ;;
            esac
          done < <(git log --pretty=format:%s "$COMMIT_RANGE" || true)

          # Determine the bump type
          if   [ $MAJOR -eq 1 ]; then BUMP="major"
          elif [ $MINOR -eq 1 ]; then BUMP="minor"
          elif [ $PATCH -eq 1 ]; then BUMP="patch"
          else BUMP="patch" && echo "⚠️  No conventional commits, defaulting to patch"
          fi

          # Bump the semantic version
          V="${LAST_TAG#v}"
          IFS='.' read -r v_major v_minor v_patch <<< "$V"
          case $BUMP in
            major) ((v_major++)); v_minor=0; v_patch=0 ;;
            minor) ((v_minor++)); v_patch=0 ;;
            patch) ((v_patch++)) ;;
          esac
          NEW_VERSION="v$v_major.$v_minor.$v_patch"

          # Output the new version
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ github.sha }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ env.NEW_VERSION }}
            BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            GO_VERSION=${{ env.GO_VERSION }}

      - name: Resolve image digest
        id: export
        run: |
          IMAGE_WITH_TAG="${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ github.sha }}"

          DIGEST=$(docker buildx imagetools inspect \
            "${IMAGE_WITH_TAG}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')

          if [ -z "$DIGEST" ]; then
            echo "❌ Failed to retrieve image digest"
            exit 1
          fi

          IMAGE="${{ env.REGISTRY }}/${{ env.REPO_LOWER }}@${DIGEST}"
          DOCKER_BUILD_RUN_ID=${{ github.run_id }}

          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "docker_build_run_id=${DOCKER_BUILD_RUN_ID}" >> $GITHUB_OUTPUT

          # persist data for downstream job
          echo "${DIGEST}" > digest.txt
          echo "${IMAGE}" > image.txt
          echo "${DOCKER_BUILD_RUN_ID}" > docker_build_run_id.txt

      - name: Upload image metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-metadata
          path: |
            digest.txt
            image.txt
            docker_build_run_id.txt

  test-image:
    name: Test Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres  # Default postgres user
          POSTGRES_PASSWORD: postgres # Test credentials
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ needs.build.outputs.image }}

      - name: Validate image structure
        run: |
          docker inspect ${{ needs.build.outputs.image }} > /dev/null && {
            echo "✅ Image is valid and accessible"
          } || {
            echo "❌ Image inspection failed"
            exit 1
          }

      - name: Test container startup
        run: |
          echo "Starting container..."
          CONTAINER_ID=$(docker run -d \
            --network ${{ job.services.postgres.network }} \
            -e DB_URL='postgres://postgres:postgres@postgres:5432/testdb?sslmode=disable' \
            -p 8080:8080 \
            ${{ needs.build.outputs.image }} api)

          echo "Waiting for API to be ready..."
          for i in {1..15}; do
            if curl -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Container started and API is responsive"
              docker logs $CONTAINER_ID
              docker stop $CONTAINER_ID
              exit 0
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done

          echo "❌ API not healthy"
          echo "Container logs:"
          docker logs $CONTAINER_ID
          docker stop $CONTAINER_ID
          exit 1

  sign-image:
    name: Sign Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      packages: write
      id-token: write   # REQUIRED for cosign OIDC

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.0"

      - name: Sign image using cosign
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            --oidc-issuer=https://token.actions.githubusercontent.com \
            ${{ needs.build.outputs.image }}

  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && !cancelled()

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ needs.build.outputs.repo_lower }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
        continue-on-error: true

  trigger-migrate:
    name: Repository Dispatch
    needs: [build, test-image, sign-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to trigger repository dispatch

    steps:
      - name: Trigger migration workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          event-type: run-migrations
          client-payload: |
            {
              "sha": "${{ github.event.client_payload.sha }}",
              "run_id": "${{ needs.build.outputs.docker_build_run_id }}",
              "branch": "${{ github.event.client_payload.branch }}",
              "version": "${{ needs.build.outputs.version }}"
            }
