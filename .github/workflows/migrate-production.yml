# Purpose:
#   Run database migrations safely
#   Fail deployment if migrations fail
#   Execute migrate CLI with arguments

name: Production Database Migration

on:
  workflow_run:
    workflows: ["Docker Build"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

env:
  GO_VERSION: '1.25.0'

jobs:
  migrate:
    name: Run Production Database Migrations
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build migrate binary
        run: |
          go build -o migrate ./cmd/migrate
          chmod +x migrate

      - name: Verify migrate tool works
        run: ./migrate version

      - name: Test database connection
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          ./migrate version || echo "No migrations applied yet"

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DB_URL }}
        run: |
          echo "🔄 Running migrations on production..."
          ./migrate up
          echo "✅ Migrations completed successfully"

      - name: Verify migration version
        env:
          DATABASE_URL: ${{ secrets.DB_URL }}
        run: |
          CURRENT_VERSION=$(./migrate version)
          echo "Current migration version: $CURRENT_VERSION"