# Purpose:
#   Run tests
#   Validate builds
#   Validate PostgreSQL integration
#   Ensure application compiles correctly

name: CI

on:
  pull_request:
      branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read      

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres # gitguardian:ignore
          POSTGRES_PASSWORD: postgres # gitguardian:ignore
          POSTGRES_DB: app_test # gitguardian:ignore
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost # gitguardian:ignore
      DB_PORT: 5432 # gitguardian:ignore
      DB_USER: postgres # gitguardian:ignore
      DB_PASSWORD: postgres # gitguardian:ignore
      DB_NAME: app_test # gitguardian:ignore
      DB_SSLMODE: disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: false

      - name: Clean Go caches
        run: |
          go clean -cache
          go clean -modcache
          rm -rf cache/go-build

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Build API
        run: |
          mkdir -p bin
          go build -o bin/api ./cmd/api/

      - name: Run tests
        run: |
          PACKAGES=$(go list ./... | grep -v '/cmd/')
          go test -v -race -coverprofile=coverage.out -covermode=atomic $PACKAGES

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
