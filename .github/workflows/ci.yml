# Purpose:
#   Run tests
#   Validate builds
#   Validate PostgreSQL integration
#   Ensure application compiles correctly

name: CI

on:
  pull_request:
      branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

env:
  GO_VERSION: '1.25.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Build Application
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres # gitguardian: ignore
          POSTGRES_PASSWORD: postgres # gitguardian: ignore
          POSTGRES_DB: app_test # gitguardian: ignore
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Database connection details for tests (use GitHub Secrets in production)
      DB_HOST: localhost # gitguardian: ignore
      DB_PORT: 5432 # gitguardian: ignore
      DB_USER: postgres # gitguardian: ignore
      DB_PASSWORD: postgres # gitguardian: ignore
      DB_NAME: app_test # gitguardian: ignore
      DB_SSLMODE: disable # gitguardian: ignore

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run tests with coverage
        run: |
          mkdir -p coverage

          go test ./... \
          -v \
          -race \
            -covermode=atomic \
            -coverprofile=coverage/coverage.out

      - name: Generate coverage summary
        id: coverage
        run: |
          go tool cover -func=coverage/coverage.out | tail -1
          COVERAGE=$(go tool cover -func=coverage/coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "coverage percentage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage.out

      - name: Build API
        run: |
          mkdir -p bin
          go build -o bin/api ./cmd/api/
