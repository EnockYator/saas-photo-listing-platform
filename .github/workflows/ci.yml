# Purpose:
#   Run tests
#   Validate builds
#   Validate PostgreSQL integration
#   Ensure application compiles correctly

name: CI

on:
  pull_request:
      branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

# Referencing env variables that are set a runtime
env:
  GO_VERSION: '1.25.0'
  POSTGRES_USER: ${{ env.TEST_DB_USER }}
  POSTGRES_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
  POSTGRES_DB: ${{ env.TEST_DB_NAME }}

jobs:
  test:
    name: Test & Build Application
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}

    services:
      postgres:
        image: postgres:16-alpine
      env:
        TEST_DB_USER: ${{ secrets.TEST_POSTGRES_USER }}
        TEST_DB_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        TEST_DB_NAME: ${{ secrets.TEST_POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "waiting for postgres..."
            sleep 2
          done

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          go test ./... \
          -v \
          -race \
          -covermode=atomic \
          -coverprofile=coverage/coverage.out

      - name: Generate coverage summary
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage/coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "coverage percentage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage.out

      - name: Build API
        run: |
          mkdir -p bin
          go build -o bin/api ./cmd/api/

      - name: Build Migrate
        run: |
          go build -o bin/migrate ./cmd/migrate/
