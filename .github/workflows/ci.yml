# Purpose:
#   Run tests
#   Validate builds
#   Validate PostgreSQL integration
#   Ensure application compiles correctly

name: CI

on:
  pull_request:
      branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: write   # Required by called workflow docker-build.yml
  id-token: write   # Required by cosign signing inside docker-build.yml

env:
  GO_VERSION: '1.25.0'

jobs:
  test:
    name: Test & Build Application
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres  # Default postgres user
          POSTGRES_PASSWORD: postgres # Test credentials
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "waiting for postgres..."
            sleep 2
          done

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run tests with coverage
        env:
          POSTGRES_USER: postgres  # Test credentials
          POSTGRES_PASSWORD: postgres  # Default test credentials
          POSTGRES_DB: testdb  # Simple test database
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          mkdir -p coverage
          go test ./... \
          -v \
          -race \
          -covermode=atomic \
          -coverprofile=coverage/coverage.out

      - name: Generate coverage summary
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage/coverage.out | tail -n 1 | awk '{print $3}' | sed 's/%//')  # Fixed: tail -n 1
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT  # Fixed: Output name without spaces

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage.out

      - name: Build API
        run: |
          mkdir -p bin
          go build -o bin/api ./cmd/app/

  trigger-docker-build:
    name: Repository Dispatch
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to trigger repository dispatch

    steps:
      - name: Trigger Docker Build
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          event-type: docker-build
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
