# Purpose:
#   Run tests
#   Validate builds
#   Validate PostgreSQL integration
#   Ensure application compiles correctly

name: CI

on:
  pull_request:
      branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read      

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          DB_URL: ${{ secrets.DB_URL }} # gitguardian:ignore
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: ${{ secrets.DB_URL }} # gitguardian:ignore
      GO111MODULE: on

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Build API
        run: go build -v ./cmd/api

      - name: Build migrate CLI
        run: go build -v ./cmd/migrate

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
