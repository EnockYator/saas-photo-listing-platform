name: CI

on:
  push:
    branches: [main, feat]
  pull_request:
    branches: [main, feat]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Check Format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "format issues found"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
          | sh -s latest

      - name: Lint
        run: bin/golangci-lint run ./...

      - name: Run tests
        run: go test ./... -v -race

      - name: Build API
        run: go build ./cmd/api