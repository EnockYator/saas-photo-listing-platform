# Purpose:
#   Create GitHub Release after successful production deployment

name: Create Release

on:
  workflow_run:
    workflows: ["Deploy to Production"]
    branches: [main]
    types: [completed]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read  # Needed when downloading artifacts from another workflow run

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/app

jobs:
  release:
    name: Create GitHub Release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.export.outputs.digest }}
      image: ${{ steps.export.outputs.image }}
      docker_build_run_id: ${{ steps.export.outputs.docker_build_run_id }}

    steps:
      # Download image-metadata artifact from Docker Build workflow
      - name: Download image metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Load immutable image metadata
      - name: Load image metadata
        id: export
        run: |
          if [ ! -f digest.txt ] || [ ! -f image.txt ] || [ ! -f docker_build_run_id.txt ]; then
            echo "❌ Missing required artifact files"
            ls -la
            exit 1
          fi

          DIGEST="$(cat digest.txt | tr -d '\n')"
          if [ -z "$DIGEST" ]; then
            echo "❌ Missing image digest artifact"
            exit 1
          fi

          IMAGE="$(cat image.txt | tr -d '\n')"
          if [ -z "$IMAGE" ]; then
            echo "❌ Missing image name artifact"
            exit 1
          fi

          DOCKER_BUILD_RUN_ID="$(cat docker_build_run_id.txt | tr -d '\n')"
          if [ -z "$DOCKER_BUILD_RUN_ID" ]; then
            echo "❌ Missing docker build run ID artifact"
            exit 1
          fi

          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "DOCKER_BUILD_RUN_ID=$DOCKER_BUILD_RUN_ID" >> $GITHUB_ENV

          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "docker_build_run_id=${DOCKER_BUILD_RUN_ID}" >> $GITHUB_OUTPUT

          echo "Using image: $IMAGE"
          echo "Using digest: $DIGEST"
          echo "Using docker_build_run_id: $DOCKER_BUILD_RUN_ID"

      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # Load release notes
      # ----------------------------
      - name: Read RELEASE_NOTES.md
        id: notes
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "❌ RELEASE_NOTES.md not found"
            exit 1
          fi

          # Use environment variable to safely handle multiline content
          NOTES=$(cat RELEASE_NOTES.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ----------------------------
      # Determine tag
      # ----------------------------
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v$(date +%Y.%m.%d)-${GITHUB_SHA::7}"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # ----------------------------
      # Create GitHub Release
      # ----------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## Release Notes

            ${{ steps.notes.outputs.notes }}

            ---

            ## Deployment Info

            - Commit: `${{ github.sha }}`
            - Image: `${{ env.IMAGE }}`
            - Digest: `${{ env.DIGEST }}`

          draft: false
          prerelease: false