# Purpose:
#   Create GitHub Release after successful production deployment

name: Create Release

on:
  workflow_call:
    inputs:
      sha:
        description: 'The commit SHA that triggered the build / from orchestrator workflow'
        required: true
        type: string
      digest:
        description: 'The Docker image digest (immutable reference)'
        required: true
        type: string
      image:
        description: 'The Docker image to use for migrations'
        required: true
        type: string
      version:
        description: 'The version to release - computed from docker-build (e.g. v1.2.3)'
        required: true
        type: string
      deploy_id:
        description: 'The Render deploy ID for the production deployment'
        required: true
        type: string
      environment:
        description: 'The target environment for migrations (e.g. staging, production)'
        required: true
        type: string

    outputs:
      image:
        description: 'The Docker image that was deployed'
        value: ${{ jobs.release.outputs.image }}
      digest:
        description: 'The Docker image digest (immutable reference)'
        value: ${{ jobs.release.outputs.digest }}
      version:
        description: 'The version to release - computed from docker-build (e.g. v1.2.3)'
        value: ${{ jobs.release.outputs.version }}
      deploy_id:
        description: 'The Render deploy ID for the production deployment'
        value: ${{ jobs.release.outputs.deploy_id }}

permissions:
  contents: write      # to create tags and releases
  actions: read
  packages: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      image: ${{ steps.export.outputs.image }}
      digest: ${{ steps.export.outputs.digest }}
      version: ${{ steps.export.outputs.version }}
      deploy_id: ${{ steps.export.outputs.deploy_id }}

    steps:
      # ---------- 1. Validate payload ----------
      - name: Validate dispatch payload
        id: validate
        run: |
          NEW_TAG=${{ inputs.version }}

          if [[ ! "$NEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $NEW_TAG"
            exit 1
          fi

          echo "version=$NEW_TAG" >> $GITHUB_OUTPUT

      # ---------- 2. Checkout full history ----------
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      # ---------- 3. Download image metadata ----------

      - name: Load image metadata
        id: export
        run: |
          IMAGE=${{ inputs.image }}
          DIGEST=${{ inputs.digest }}
          VERSION=${{ inputs.version }}
          DEPLOY_ID=${{ inputs.deploy_id }}

          if [ -z "$IMAGE" ] || [ -z "$DIGEST" ] || [ -z "$VERSION" ] || [ -z "$DEPLOY_ID" ]; then
            echo "❌ Missing required input values"
            exit 1
          fi

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "deploy_id=${DEPLOY_ID}" >> $GITHUB_OUTPUT

          echo "✅ Using image: $IMAGE"

      # ---------- 4. Create tag ----------
      - name: Create tag
        run: |
          git tag "${{ steps.validate.outputs.version }}"
          git push origin "${{ steps.validate.outputs.version }}"

      # ---------- 5. Generate changelog (commits since last tag) ----------
      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git tag --sort=-v:refname --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)")
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "$LAST_TAG..HEAD")
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ---------- 7. RELEASE_NOTES.md ----------
      - name: Read RELEASE_NOTES.md if present
        id: manual_notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            NOTES=$(cat RELEASE_NOTES.md)
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "notes=" >> $GITHUB_OUTPUT
          fi

      # ---------- 8. Create Release ----------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.validate.outputs.version }}
          name: Release ${{ steps.validate.outputs.version }}
          body: |
            # Release ${{ steps.validate.outputs.version }}

            ## 🚀 Deployment Details
            - **Commit Sha**: `${{ inputs.sha }}`
            - **Image**: `${{ steps.export.outputs.image }}`
            - **Digest**: `${{ steps.export.outputs.digest }}`
            - **Build workflow run**: [View](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Production deploy run**: [View](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ---

            ## 📝 Changes since last release
            ${{ steps.changelog.outputs.changelog }}

            ${{ steps.manual_notes.outputs.notes != '' && format('---\n\n## 📋 Manual Release Notes\n\n{0}', steps.manual_notes.outputs.notes) || '' }}

            ---

            *Released by GitHub Actions – immutable image pinned by digest.*
          draft: false
          prerelease: false
