# Purpose:
#   Build production binaries
#   Trigger on Git tags
#   Create downloadable GitHub Releases

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build Linux API binary
        run: |
          GOOS=linux GOARCH=amd64 go build -o saas-photo-listing-platform-api-linux-amd64 ./cmd/api

      - name: Build Linux migrate binary
        run: |
          GOOS=linux GOARCH=amd64 go build -o saas-photo-listing-platform-migrate-linux-amd64 ./cmd/migrate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            saas-photo-listing-platform-api-linux-amd64
            saas-photo-listing-platform-migrate-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}