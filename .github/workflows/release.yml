# Purpose:
#   Create GitHub Release after successful production deployment

name: Create Release

on:
  workflow_call:
    inputs:
      sha:
        description: 'The commit SHA that triggered the build / from orchestrator workflow'
        required: true
        type: string
      environment:
        description: 'The target environment for migrations (e.g. staging, production)'
        required: true
        type: string

permissions:
  contents: write      # to create tags and releases
  actions: read
  packages: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      image: ${{ steps.export.outputs.image }}
      digest: ${{ steps.export.outputs.digest }}
      version: ${{ steps.validate.outputs.version }}
      repo_lower: ${{ steps.export.outputs.repo_lower }}
      staging_deploy_id: ${{ steps.export.outputs.staging_deploy_id }}
      production_deploy_id: ${{ steps.export.outputs.production_deploy_id }}

    steps:
      - name: Download metadata
        uses: actions/download-artifact@v7
        with:
          name: pipeline-metadata

      - name: Load metadata
        id: export
        run: |
          source metadata.env

          if [ -z "$IMAGE" ] || [ -z "$DIGEST" ] || [ -z "$VERSION" ] || [ -z "$REPO_LOWER" ] || [ -z "STAGING_DEPLOY_ID" ] || [ -z "PRODUCTION_DEPLOY_ID" ]; then
            echo "❌ Missing required metadata values"
            exit 1
          fi

          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT
          echo "staging_deploy_id=${STAGING_DEPLOY_ID}" >> $GITHUB_OUTPUT
          echo "production_deploy_id=${PRODUCTION_DEPLOY_ID}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Validate dispatch payload
        id: validate
        run: |
          NEW_TAG=${{ inputs.version }}

          if [[ ! "$NEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $NEW_TAG"
            exit 1
          fi

          echo "version=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Re-upload metadata
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-metadata
          path: metadata.env

      - name: Create tag
        run: |
          git tag "${{ steps.validate.outputs.version }}"
          git push origin "${{ steps.validate.outputs.version }}"

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git tag --sort=-v:refname --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)")
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "$LAST_TAG..HEAD")
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ---------- 7. RELEASE_NOTES.md ----------
      - name: Read RELEASE_NOTES.md if present
        id: manual_notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            NOTES=$(cat RELEASE_NOTES.md)
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "notes=" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.validate.outputs.version }}
          name: Release ${{ steps.validate.outputs.version }}
          body: |
            # Release ${{ steps.validate.outputs.version }}

            ## 🚀 Deployment Details
            - **Commit Sha**: `${{ inputs.sha }}`
            - **Image**: `${{ steps.export.outputs.image }}`
            - **Digest**: `${{ steps.export.outputs.digest }}`
            - **Build workflow run**: [View](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Production deploy run**: [View](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ---

            ## 📝 Changes since last release
            ${{ steps.changelog.outputs.changelog }}

            ${{ steps.manual_notes.outputs.notes != '' && format('---\n\n## 📋 Manual Release Notes\n\n{0}', steps.manual_notes.outputs.notes) || '' }}

            ---

            *Released by GitHub Actions – immutable image pinned by digest.*
          draft: false
          prerelease: false
