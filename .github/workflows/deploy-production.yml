
# Purpose:
#   Deploy already-built Docker images to Render production (main branch)
#   Generate .env from GitHub Secrets and apply to Render
#   Deploy only after migrations succeed
#   Uses immutable digest (best practice)

name: Deploy to Production

on:
  workflow_run:
    workflows: ["Migrations"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  deploy-render-production:
    name: Deploy to Render Production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Get stored Docker Build run_id
        run: |
          DOCKER_BUILD_RUN_ID=$(gh variable get DOCKER_BUILD_RUN_ID)
          if [ -z "$DOCKER_BUILD_RUN_ID" ]; then
            echo "❌ Missing DOCKER_BUILD_RUN_ID variable"
            exit 1
          fi
          echo "DOCKER_BUILD_RUN_ID=$DOCKER_BUILD_RUN_ID" >> $GITHUB_ENV

      # Download image-metadata artifact from Docker Build workflow
      - name: Download image metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: .
          run-id: ${{ DOCKER_BUILD_RUN_ID }}  # Docker Build's run_id

      # Load immutable image metadata (digest, image)
      - name: Load image metadata
        run: |
          DIGEST="$(cat digest.txt | tr -d '\n')"
          if [ -z "$DIGEST" ]; then
            echo "❌ Missing image digest artifact"
            exit 1
          fi

          IMAGE="$(cat image.txt | tr -d '\n')"
          if [ -z "$IMAGE" ]; then
            echo "❌ Missing image name artifact"
            exit 1
          fi

          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

          echo "Using image: $IMAGE"
          echo "Using digest: $DIGEST"

      # ----------------------------
      # RENDER ENV VARS
      # ----------------------------
      - name: Update Render Environment Variables
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -e

          declare -A vars=(
            [DB_HOST]="${{ secrets.DB_HOST }}"
            [DB_URL]="${{ secrets.DB_URL }}"
            [DB_USER]="${{ secrets.DB_USER }}"
            [DB_PASSWORD]="${{ secrets.DB_PASSWORD }}"
            [DB_NAME]="${{ secrets.DB_NAME }}"
            [DB_SSLMODE]="${{ secrets.DB_SSLMODE }}"
            [CHANNEL_BINDING]="${{ secrets.CHANNEL_BINDING }}"
            [DB_DRIVER]="${{ secrets.DB_DRIVER }}"

            [APP_ENV]="${{ secrets.APP_ENV }}"
            [PROJECT_NAME]="${{ secrets.PROJECT_NAME }}"

            [SERVER_PORT]="${{ secrets.SERVER_PORT }}"
            [SERVER_READ_TIMEOUT]="${{ secrets.SERVER_READ_TIMEOUT }}"
            [SERVER_WRITE_TIMEOUT]="${{ secrets.SERVER_WRITE_TIMEOUT }}"
            [SERVER_IDLE_TIMEOUT]="${{ secrets.SERVER_IDLE_TIMEOUT }}"

            [JWT_SECRET]="${{ secrets.JWT_SECRET }}"
            [JWT_EXPIRATION]="${{ secrets.JWT_EXPIRATION }}"

            [LOG_LEVEL]="${{ secrets.LOG_LEVEL }}"
            [DEBUG]="${{ secrets.DEBUG }}"

            [APP_PORT]="${{ secrets.APP_PORT }}"
            [MEMORY_LIMIT]="${{ secrets.MEMORY_LIMIT }}"
            [CPU_LIMIT]="${{ secrets.CPU_LIMIT }}"
            [MEMORY_RESERVE]="${{ secrets.MEMORY_RESERVE }}"
            [CPU_RESERVE]="${{ secrets.CPU_RESERVE }}"
            [REPLICAS]="${{ secrets.REPLICAS }}"
          )

          for key in "${!vars[@]}"; do
            curl -s -X POST \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars" \
              -H "accept: application/json" \
              -H "authorization: Bearer $RENDER_API_KEY" \
              -H "content-type: application/json" \
              -d "{\"envVar\": {\"key\": \"$key\", \"value\": \"${vars[$key]}\"}}"
          done

          curl -s -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars" \
            -H "authorization: Bearer $RENDER_API_KEY" \
            -H "content-type: application/json" \
            -d '{"envVar": {"key": "RENDER_SERVICE_ID", "value": "'"$RENDER_SERVICE_ID"'"}}'

      # ----------------------------
      # Deploy image using immutable name (attached to digest)
      # ----------------------------
      - name: Trigger Production Deploy on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DOMAIN: ${{ secrets.RENDER_DOMAIN }}
        run: |

          RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "authorization: Bearer $RENDER_API_KEY" \
            -H "content-type: application/json" \
            -d "{\"imageUrl\": \"$IMAGE\"}")

          echo "$RESPONSE"

          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ "$DEPLOY_ID" = "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "❌ Deploy failed"
            exit 1
          fi

          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_ENV

      # ----------------------------
      # Wait for deployment to complete
      # ----------------------------
      - name: Wait for deployment to complete
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -e

          for i in {1..30}; do
            STATUS=$(curl -s \
              -H "authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
              | jq -r '.[0].status')

            echo "Status: $STATUS"

            case "$STATUS" in
              live) exit 0 ;;
              failed) exit 1 ;;
              deploying|build_in_progress) sleep 10 ;;
              *) echo "unknown status" ;;
            esac
          done

          echo "❌ Deployment timeout"
          exit 1

      # ----------------------------
      # Verify deployment
      # ----------------------------
      - name: Verify production deployment
        run: |
          sleep 10

          DOMAIN="${{ secrets.RENDER_DOMAIN }}"

          if [ -z "$DOMAIN" ]; then
            echo "⚠️ No domain set"
            exit 0
          fi

          curl -f "https://$DOMAIN/health" || echo "health endpoint missing"
          curl -f "https://$DOMAIN/version" || echo "version endpoint missing"

      # ----------------------------
      # Cleanup sensitive files
      # ----------------------------
      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f .env.production
