# Production Deployment Workflow
# Purpose:
#   Deploy main branch to production
#   Deploy only after migrations succeed

name: Deploy to Production

on:
  workflow_run:
    workflows: ["Production Database Migration"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-flyio:
    name: Deploy to Fly.io Production
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only \
            --config fly.production.toml \
            --image ghcr.io/${{ github.repository }}-api:${{ github.sha }}

      - name: Verify Fly.io deployment
        run: |
          curl -f https://api.fly.io/v1/apps/saas-photo-listing-platform-production/health || exit 1

  deploy-render:
    name: Deploy to Render Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_PRODUCTION_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
        run: |
          curl -X POST \
            https://api.render.com/v1/services/${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}/deploys \
            -H "accept: application/json" \
            -H "authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "content-type: application/json" \
            -d '{
              "image": {
                "imageUrl": "ghcr.io/${{ github.repository }}-api:${{ github.sha }}"
              }
            }'
