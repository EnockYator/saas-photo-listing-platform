# Purpose:
#   Deploy already-built Docker image to Render production (main branch)
#   Generate .env from GitHub Secrets and apply to Render
#   Deploy only after migrations succeed

name: Deploy to Production

on:
  workflow_call:
    inputs:
      sha:
        description: 'The commit SHA that triggered the build / from orchestrator workflow'
        required: true
        type: string
      environment:
        description: 'The target environment for migrations (production)'
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  deploy-render-production:
    name: Deploy to Render Production
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.export.outputs.image }}
      digest: ${{ steps.export.outputs.digest }}
      version: ${{ steps.export.outputs.version }}
      repo_lower: ${{ steps.export.outputs.repo_lower }}
      production_deploy_id: ${{ steps.deploy.outputs.production_deploy_id }}

    steps:
      - name: Download metadata
        uses: actions/download-artifact@v7
        with:
          name: pipeline-metadata

      - name: Load metadata
        id: export
        run: |
          set -a
          source metadata.env
          set +a

          if [ -z "$IMAGE" ] || [ -z "$DIGEST" ] || [ -z "$VERSION" ] || [ -z "$REPO_LOWER" ]; then
            echo "❌ Missing required metadata values"
            exit 1
          fi

          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}

      # ----------------------------
      # Render ENV variables
      # ----------------------------
      - name: Update Render Environment Variables
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DOMAIN: ${{ secrets.RENDER_DOMAIN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
          CHANNEL_BINDING: ${{ secrets.CHANNEL_BINDING }}
          DB_DRIVER: ${{ secrets.DB_DRIVER }}
          APP_ENV: ${{ secrets.APP_ENV }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_READ_TIMEOUT: ${{ secrets.SERVER_READ_TIMEOUT }}
          SERVER_WRITE_TIMEOUT: ${{ secrets.SERVER_WRITE_TIMEOUT }}
          SERVER_IDLE_TIMEOUT: ${{ secrets.SERVER_IDLE_TIMEOUT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          DEBUG: ${{ secrets.DEBUG }}
          APP_PORT: ${{ secrets.APP_PORT }}
          MEMORY_LIMIT: ${{ secrets.MEMORY_LIMIT }}
          CPU_LIMIT: ${{ secrets.CPU_LIMIT }}
          MEMORY_RESERVE: ${{ secrets.MEMORY_RESERVE }}
          CPU_RESERVE: ${{ secrets.CPU_RESERVE }}
          REPLICAS: ${{ secrets.REPLICAS }}
        run: |
          set -e
          # List of variable names that will be sent to Render
          VAR_NAMES=(
            DB_HOST DB_URL DB_USER DB_PASSWORD DB_NAME DB_SSLMODE
            CHANNEL_BINDING DB_DRIVER APP_ENV PROJECT_NAME
            SERVER_PORT SERVER_READ_TIMEOUT SERVER_WRITE_TIMEOUT SERVER_IDLE_TIMEOUT
            JWT_SECRET JWT_EXPIRATION LOG_LEVEL DEBUG APP_PORT
            MEMORY_LIMIT CPU_LIMIT MEMORY_RESERVE CPU_RESERVE REPLICAS
          )

          for key in "${VAR_NAMES[@]}"; do
            # Retrieve the value from the environment (empty if not set)
            value="${!key}"

            # Safely build the JSON payload with jq (no string interpolation)
            json_payload=$(jq -nc --arg val "$value" '{value: $val}')

            response=$(curl -s -w "%{http_code}" -X PUT \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}" \
              -H "accept: application/json" \
              -H "authorization: Bearer ${RENDER_API_KEY}" \
              -H "content-type: application/json" \
              -d "$json_payload")

            http_code=${response: -3}
            if [ "$http_code" != "200" ]; then
              echo "❌ Failed to update env var ${key} (HTTP ${http_code})"
              exit 1
            fi
          done

          # Also set RENDER_SERVICE_ID (no secret needed, value is already in env)
          curl -s -X PUT \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/RENDER_SERVICE_ID" \
            -H "authorization: Bearer ${RENDER_API_KEY}" \
            -H "content-type: application/json" \
            -d "{\"value\": \"${RENDER_SERVICE_ID}\"}"

      # ----------------------------
      # Deploy image using name (attached to immutable digest)
      # ----------------------------
      - name: Trigger Production Deploy on Render
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Deploying image: ${{ steps.export.outputs.image }}"

          RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "authorization: Bearer ${RENDER_API_KEY}" \
            -H "content-type: application/json" \
            -d "{\"imageUrl\": \"${{ steps.export.outputs.image }}\"}")

          echo "$RESPONSE"

          PRODUCTION_DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ "$PRODUCTION_DEPLOY_ID" = "null" ] || [ -z "$PRODUCTION_DEPLOY_ID" ]; then
            echo "❌ Deploy failed"
            exit 1
          fi

          echo "production_deploy_id=${PRODUCTION_DEPLOY_ID}" >> $GITHUB_OUTPUT

      - name: Save metadata to file
        run: |
          cat <<EOF > metadata.env
          IMAGE=${{ steps.export.outputs.image }}
          DIGEST=${{ steps.export.outputs.digest }}
          REPO_LOWER=${{ steps.export.outputs.repo_lower }}
          VERSION=${{ steps.export.outputs.version }}
          PRODUCTION_DEPLOY_ID=${{ steps.deploy.outputs.production_deploy_id }}
          EOF

      - name: Re-upload metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-metadata
          path: metadata.env

      # ----------------------------
      # Wait for deployment to complete
      # ----------------------------
      - name: Wait for deployment to complete
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          PRODUCTION_DEPLOY_ID: ${{ steps.deploy.outputs.production_deploy_id }}
        run: |
          set -e

          for i in {1..60}; do
            RESPONSE=$(curl -s \
              -H "authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${PRODUCTION_DEPLOY_ID}")

            echo "$RESPONSE"

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Status: $STATUS"

            case "$STATUS" in
              live)
                echo "Deployment successful"
                exit 0
                ;;
              failed)
                echo "Deployment failed"
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Deployment timeout"
          exit 1

      # ----------------------------
      # Verify deployment
      # ----------------------------
      - name: Verify production deployment
        run: |
          sleep 10

          DOMAIN="${{ secrets.RENDER_DOMAIN }}"

          if [ -z "$DOMAIN" ]; then
            echo "⚠️ No domain set"
            exit 0
          fi

          if ! curl -f "${DOMAIN}/health"; then
            echo "⚠️ health endpoint missing"
          fi

          if ! curl -f "${DOMAIN}/version"; then
            echo "⚠️ version endpoint missing"
          fi
