# Purpose:
#   Deploy already-built Docker images to Render production (main branch)
#   Generate .env from GitHub Secrets and apply to Render
#   Deploy only after migrations succeed
#   Uses immutable digest (best practice)

name: Deploy to Production

on:
  workflow_call:
    inputs:
      sha:
        description: 'The commit SHA that triggered the build / from orchestrator workflow'
        required: true
        type: string
      image:
        description: 'The Docker image to use for migrations'
        required: true
        type: string
      environment:
        description: 'The target environment for migrations (e.g. staging, production)'
        required: true
        type: string
    outputs:
      image:
        description: 'The Docker image that was deployed'
        value: ${{ jobs.deploy-render-production.outputs.image }}
      digest:
        description: 'The Docker image digest (immutable reference)'
        value: ${{ jobs.deploy-render-production.outputs.digest }}
      version:
        description: 'The version to release - computed from docker-build (e.g. v1.2.3)'
        value: ${{ jobs.deploy-render-production.outputs.version }}

permissions:
  contents: read
  packages: read
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  deploy-render-production:
    name: Deploy to Render Production
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.export.outputs.image }}
      digest: ${{ steps.export.outputs.digest }}
      version: ${{ steps.export.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}

      # Load image metadata
      - name: Load image metadata
        id: export
        run: |

          IMAGE=${{ inputs.image }}
          Digest=${{ inputs.digest }}
          VERSION=${{ inputs.version }}

          if [ -z "$IMAGE" ] || [ -z "$Digest" ] || [ -z "$VERSION" ]; then
            echo "❌ Missing required input values"
            exit 1
          fi

          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "digest=${Digest}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "Using image: $IMAGE"

      # ----------------------------
      # RENDER ENV VARS
      # ----------------------------
      - name: Update Render Environment Variables
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
          CHANNEL_BINDING: ${{ secrets.CHANNEL_BINDING }}
          DB_DRIVER: ${{ secrets.DB_DRIVER }}
          APP_ENV: ${{ secrets.APP_ENV }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_READ_TIMEOUT: ${{ secrets.SERVER_READ_TIMEOUT }}
          SERVER_WRITE_TIMEOUT: ${{ secrets.SERVER_WRITE_TIMEOUT }}
          SERVER_IDLE_TIMEOUT: ${{ secrets.SERVER_IDLE_TIMEOUT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          DEBUG: ${{ secrets.DEBUG }}
          APP_PORT: ${{ secrets.APP_PORT }}
          MEMORY_LIMIT: ${{ secrets.MEMORY_LIMIT }}
          CPU_LIMIT: ${{ secrets.CPU_LIMIT }}
          MEMORY_RESERVE: ${{ secrets.MEMORY_RESERVE }}
          CPU_RESERVE: ${{ secrets.CPU_RESERVE }}
          REPLICAS: ${{ secrets.REPLICAS }}
        run: |
          set -e
          # List of variable names that will be sent to Render
          VAR_NAMES=(
            DB_HOST DB_URL DB_USER DB_PASSWORD DB_NAME DB_SSLMODE
            CHANNEL_BINDING DB_DRIVER APP_ENV PROJECT_NAME
            SERVER_PORT SERVER_READ_TIMEOUT SERVER_WRITE_TIMEOUT SERVER_IDLE_TIMEOUT
            JWT_SECRET JWT_EXPIRATION LOG_LEVEL DEBUG APP_PORT
            MEMORY_LIMIT CPU_LIMIT MEMORY_RESERVE CPU_RESERVE REPLICAS
          )

          for key in "${VAR_NAMES[@]}"; do
            # Retrieve the value from the environment (empty if not set)
            value="${!key}"

            # Safely build the JSON payload with jq (no string interpolation)
            json_payload=$(jq -nc --arg val "$value" '{value: $val}')

            response=$(curl -s -w "%{http_code}" -X PUT \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}" \
              -H "accept: application/json" \
              -H "authorization: Bearer ${RENDER_API_KEY}" \
              -H "content-type: application/json" \
              -d "$json_payload")

            http_code=${response: -3}
            if [ "$http_code" != "200" ]; then
              echo "❌ Failed to update env var ${key} (HTTP ${http_code})"
              exit 1
            fi
          done

          # Also set RENDER_SERVICE_ID (no secret needed, value is already in env)
          curl -s -X PUT \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/RENDER_SERVICE_ID" \
            -H "authorization: Bearer ${RENDER_API_KEY}" \
            -H "content-type: application/json" \
            -d "{\"value\": \"${RENDER_SERVICE_ID}\"}"

      # ----------------------------
      # Deploy image using immutable name (attached to digest)
      # ----------------------------
      - name: Trigger Production Deploy on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Deploying image: ${IMAGE}"

          RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "authorization: Bearer ${RENDER_API_KEY}" \
            -H "content-type: application/json" \
            -d "{\"imageUrl\": \"${IMAGE}\"}")

          echo "$RESPONSE"

          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ "$DEPLOY_ID" = "null" ] || [ -z "$DEPLOY_ID" ]; then
            echo "❌ Deploy failed"
            exit 1
          fi

          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_ENV
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT

      # ----------------------------
      # Wait for deployment to complete
      # ----------------------------
      - name: Wait for deployment to complete
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -e

          for i in {1..30}; do
            STATUS=$(curl -s \
              -H "authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              | jq -r '.[0].status')

            echo "Status: $STATUS"

            case "$STATUS" in
              live) exit 0 ;;
              failed) exit 1 ;;
              deploying|build_in_progress) sleep 10 ;;
              *) echo "unknown status"; sleep 10 ;;
            esac
          done

          echo "❌ Deployment timeout"
          exit 1

      # ----------------------------
      # Verify deployment
      # ----------------------------
      - name: Verify production deployment
        run: |
          sleep 10

          DOMAIN="${{ secrets.RENDER_DOMAIN }}"

          if [ -z "$DOMAIN" ]; then
            echo "⚠️ No domain set"
            exit 0
          fi

          if ! curl -f "https://${DOMAIN}/health"; then
            echo "⚠️ health endpoint missing"
          fi

          if ! curl -f "https://${DOMAIN}/version"; then
            echo "⚠️ version endpoint missing"
          fi
